spring.datasource.url=jdbc:postgresql://localhost:5432/attest
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8080
app.storage.local-path=./storage/documents
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.bootstrap.admin-sui-address=${ADMIN_BOOTSTRAP_SUI_ADDRESS:}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
app.sui.zklogin-verify-url=${ZKLOGIN_VERIFY_URL:http://localhost:3000/api/verify-zklogin}
app.sui.challenge-ttl-seconds=${WALLET_CHALLENGE_TTL_SECONDS:300}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jpa.open-in-view=false