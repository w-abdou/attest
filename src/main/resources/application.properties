spring.datasource.url=jdbc:postgresql://localhost:5432/attest
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8080
app.storage.local-path=./storage/documents
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000
app.bootstrap.admin-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.bootstrap.admin-password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jpa.open-in-view=false